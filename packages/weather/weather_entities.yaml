# packages/weather/weather_entities.yaml

template:

  - sensor:

    - name: Meteo Attuale
      unique_id: meteo_attuale

      state: >
        {{ states('weather.forecast_home') }}

    - name: Temperatura Esterna
      unique_id: temperatura_esterna

      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

      state: >
        {{ state_attr('weather.forecast_home', 'temperature') }}

    - name: Vento
      unique_id: vento

      state: >
        {% set speed = state_attr('weather.forecast_home', 'wind_speed') | float(0) %}
        {% set bearing = state_attr('weather.forecast_home', 'wind_bearing') | float(0) %}

        {% set dirs = {
          0:'N',
          1:'NE',
          2:'E',
          3:'SE',
          4:'S',
          5:'SO',
          6:'O',
          7:'NO'
        } %}

        {% set idx = ((bearing + 22.5) // 45) % 8 %}

        {{ "%2s %5.1f km/h" | format(dirs[idx | int], speed) }}

    - name: Umidita Esterna
      unique_id: umidita_esterna

      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

      state: >
        {{ state_attr('weather.forecast_home', 'humidity') }}

    - name: Pressione
      unique_id: pressione_atmosferica

      unit_of_measurement: "hPa"
      device_class: pressure
      state_class: measurement

      state: >
        {{ state_attr('weather.forecast_home', 'pressure') }}

    - name: Meteo Accumulo Pioggia 6 Ore
      unique_id: accumulo_pioggia_6_ore
      unit_of_measurement: "mm"
      state_class: measurement
      state: >
        {{ states('input_number.accumulo_pioggia_6_ore') }}

    - name: Meteo Accumulo Pioggia Domani
      unique_id: accumulo_pioggia_domani
      unit_of_measurement: "mm"
      state_class: measurement
      state: >
        {{ states('input_number.accumulo_pioggia_domani') }}

    - name: Meteo Temperatura Domani
      unique_id: temperatura_max_domani
      unit_of_measurement: "°C"
      state_class: measurement
      device_class: temperature
      state: >
        {{ states('input_number.temperatura_max_domani') }}

input_number:

  temperatura_max_domani:
    name: "Temperatura Max Domani"
    initial: 15.0
    min: -40.0
    max: 60.0
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  accumulo_pioggia_domani:
    name: "Accumulo Pioggia Domani"
    initial: 0.0
    min: 0.0
    max: 300.0
    step: 0.1
    unit_of_measurement: "mm"
    icon: mdi:water

  accumulo_pioggia_6_ore:
    name: "Accumulo Pioggia 6 Ore"
    initial: 0.0
    min: 0.0
    max: 500.0
    step: 0.1
    unit_of_measurement: "mm"
    icon: mdi:water
