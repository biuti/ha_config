# TEMPORANEO — simulazione virtuale in attesa dell'hardware fisico
# Rimuovere questo file quando il dispositivo reale è installato

# packages/water/water.yaml
# Impianto idraulico: autoclave, bollitore ACS, vasche raccolta piovana
# Dispositivi simulati in attesa dell'hardware fisico

input_boolean:

  # ── AUTOCLAVE ─────────────────────────────────────────────
  autoclave_attiva:
    name: "Autoclave Attiva"
    icon: mdi:pump

  # ── BOLLITORE ACS — Panasonic PAW-TD30C1E5-1 ─────────────
  bollitore_on:
    name: "Bollitore ACS Acceso"
    icon: mdi:water-boiler

  # ── VASCA 1 — irrigazione ─────────────────────────────────
  bypass_vasca_irrigazione:
    name: "Valvola Bypass Vasca Irrigazione"
    icon: mdi:valve

  # ── VASCA 2 — scarichi sanitari ───────────────────────────
  bypass_vasca_sanitari:
    name: "Valvola Bypass Vasca Sanitari"
    icon: mdi:valve

input_number:

  # ── BOLLITORE ACS ─────────────────────────────────────────
  temp_bollitore:
    name: "Temperatura Bollitore ACS"
    min: 0
    max: 90
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  temp_target_bollitore:
    name: "Temperatura Target Bollitore ACS"
    min: 40
    max: 80
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-check

  # ── VASCA 1 — irrigazione ─────────────────────────────────
  livello_vasca_irrigazione:
    name: "Livello Vasca Irrigazione"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:gauge

  soglia_minima_vasca_irrigazione:
    name: "Soglia Minima Vasca Irrigazione"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    initial: 10
    icon: mdi:gauge-low

  isteresi_vasca_irrigazione:
    name: Isteresi Vasca Irrigazione
    min: 1
    max: 20
    step: 1
    unit_of_measurement: "%"
    initial: 5

  # ── VASCA 2 — scarichi sanitari ───────────────────────────
  livello_vasca_sanitari:
    name: "Livello Vasca Sanitari"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:gauge

  soglia_minima_vasca_sanitari:
    name: "Soglia Minima Vasca Sanitari"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    initial: 10
    icon: mdi:gauge-low

  isteresi_vasca_sanitari:
    name: Isteresi Vasca Sanitari
    min: 1
    max: 20
    step: 1
    unit_of_measurement: "%"
    initial: 5

template:

  - sensor:

      - name: Vasca Irrigazione
        unique_id: vasca_irrigazione
        unit_of_measurement: "%"
        state: >
          {{ states('input_number.livello_vasca_irrigazione') }}

      - name: Vasca Sanitari
        unique_id: vasca_sanitari
        unit_of_measurement: "%"
        state: >
          {{ states('input_number.livello_vasca_sanitari') }}

  - switch:

      - name: Bypass Vasca Irrigazione
        unique_id: bypass_vasca_irrigazione

        state: >
          {{ is_state('input_boolean.bypass_vasca_irrigazione','on') }}

        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.bypass_vasca_irrigazione

        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.bypass_vasca_irrigazione

      - name: Bypass Vasca Sanitari
        unique_id: bypass_vasca_sanitari

        state: >
          {{ is_state('input_boolean.bypass_vasca_sanitari','on') }}

        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.bypass_vasca_sanitari

        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.bypass_vasca_sanitari

      - name: Valvola Impianto Irrigazione
        unique_id: valvola_impianto_irrigazione

        state: >
          {{ is_state('input_boolean.pompa_irrigazione','on') }}

        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.pompa_irrigazione

        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.pompa_irrigazione

  - binary_sensor:

    - name: Vasca Irrigazione Bassa
      unique_id: vasca_irrigazione_bassa

      state: >
        {{ states('input_number.livello_vasca_irrigazione')|float <
          states('input_number.soglia_minima_vasca_irrigazione')|float }}

    - name: Vasca Sanitari Bassa
      unique_id: vasca_sanitari_bassa

      state: >
        {{ states('input_number.livello_vasca_sanitari')|float <
          states('input_number.soglia_minima_vasca_sanitari')|float }}
