# packages/templates/switch_virtual.yaml
# TEMPORANEO — Template switch che wrappano gli input_boolean virtuali
# Espongono entità switch.* per compatibilità con floorplan e automazioni
# A casa ultimata: rimuovere questo file
# I sensori ZigBee fisici si espongono direttamente come switch.*
# con gli stessi entity_id tramite Zigbee2MQTT
#

input_boolean:

  scaldasalviette_bagno_padronale:
    name: Scaldasalviette Bagno Padronale

  scaldasalviette_bagno_comune:
    name: Scaldasalviette Bagno Comune

  scaldasalviette_bagno_taverna:
    name: Scaldasalviette Bagno Taverna

template:

  - switch:

      - name: "Scaldasalviette Bagno Padronale"
        unique_id: scaldasalviette_bagno_padronale

        state: >
          {{ is_state(
            'input_boolean.scaldasalviette_bagno_padronale',
            'on'
          ) }}

        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.scaldasalviette_bagno_padronale

        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.scaldasalviette_bagno_padronale

      - name: "Scaldasalviette Bagno Comune"
        unique_id: scaldasalviette_bagno_comune

        state: >
          {{ is_state(
            'input_boolean.scaldasalviette_bagno_comune',
            'on'
          ) }}

        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.scaldasalviette_bagno_comune

        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.scaldasalviette_bagno_comune

      - name: "Scaldasalviette Bagno Taverna"
        unique_id: scaldasalviette_bagno_taverna

        state: >
          {{ is_state(
            'input_boolean.scaldasalviette_bagno_taverna',
            'on'
          ) }}

        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.scaldasalviette_bagno_taverna

        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.scaldasalviette_bagno_taverna
