  panasonic_cop:
    name: "Panasonic COP"
    min: 0
    max: 10
    step: 0.01
    unit_of_measurement: ""
    icon: mdi:leaf

  # ── IMPIANTO GEOTERMICO ECWK (EXRG) ──────────────────────
  # Pre-trattamento aria: circuito glicole/aria interrato
  # Integrazione: sensori ZigBee temperatura/umidità
  # (o Modbus se centralina EXRG lo supporta — verificare con fornitore)

  geo_temp_aria_pre_scambiatore:
    name: "Geotermico Temperatura Aria Pre-Scambiatore"
    min: -20
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down

  geo_temp_aria_post_scambiatore:
    name: "Geotermico Temperatura Aria Post-Scambiatore"
    min: -20
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up

  geo_temp_glicole_mandata:
    name: "Geotermico Temperatura Glicole Mandata"
    min: -10
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines

  geo_temp_glicole_ritorno:
    name: "Geotermico Temperatura Glicole Ritorno"
    min: -10
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines

template:

  - sensor:
    - name: "Geotermico Delta Temperatura Aria"
      unique_id: geo_delta_temperatura_calcolato
      unit_of_measurement: "°C"
      icon: mdi:thermometer-alert
      state: >
        {{ (states('input_number.geo_temp_aria_post_scambiatore') | float
            - states('input_number.geo_temp_aria_pre_scambiatore') | float) | round(1) }}
      attributes:
        descrizione: >
          Positivo in inverno (lo scambiatore riscalda l'aria),
          negativo in estate (lo scambiatore raffredda l'aria).

    - name: "Geotermico Delta Glicole"
      unique_id: geo_delta_glicole_calcolato
      unit_of_measurement: "°C"
      icon: mdi:thermometer-lines
      state: >
        {{ (states('input_number.geo_temp_glicole_mandata') | float
            - states('input_number.geo_temp_glicole_ritorno') | float) | round(1) }}
      attributes:
        descrizione: >
          Delta temperatura circuito glicole.
          Indica l'energia scambiata con il terreno.

    - name: Temperatura Soggiorno
      unique_id: temperatura_soggiorno
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: "{{ states('input_number.temp_soggiorno') }}"

    - name: Umidità Soggiorno
      unique_id: umidita_soggiorno
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      state: "{{ states('input_number.humidity_soggiorno') }}"

    - name: Umidità Bagno Padronale
      unique_id: umidita_bagno_padronale
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      state: "{{ states('input_number.humidity_bagno_padronale') }}"

    - name: Umidità Bagno Comune
      unique_id: umidita_bagno_comune
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      state: "{{ states('input_number.humidity_bagno_comune') }}"

    - name: Temperatura Camera Padronale
      unique_id: temperatura_camera_padronale
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: "{{ states('input_number.temp_camera_padronale') }}"

    - name: Temperatura Taverna
      unique_id: temperatura_taverna
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: "{{ states('input_number.temp_taverna') }}"

    - name: Umidità Taverna
      unique_id: umidita_taverna
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      state: "{{ states('input_number.humidity_taverna') }}"

    - name: CO2 Taverna
      unique_id: co2_taverna
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      state: "{{ states('input_number.co2_taverna') }}"

    - name: CO2 Soggiorno
      unique_id: co2_soggiorno
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      state: "{{ states('input_number.co2_soggiorno') }}"

    - name: CO2 Camera Padronale
      unique_id: co2_camera_padronale
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      state: "{{ states('input_number.co2_camera_padronale') }}"

  - switch:

    - name: "Scaldasalviette Bagno Padronale"
      unique_id: scaldasalviette_bagno_padronale

      state: >
        {{ is_state(
          'input_boolean.scaldasalviette_bagno_padronale',
          'on'
        ) }}

      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.scaldasalviette_bagno_padronale

      turn_off:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.scaldasalviette_bagno_padronale

    - name: "Scaldasalviette Bagno Comune"
      unique_id: scaldasalviette_bagno_comune

      state: >
        {{ is_state(
          'input_boolean.scaldasalviette_bagno_comune',
          'on'
        ) }}

      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.scaldasalviette_bagno_comune

      turn_off:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.scaldasalviette_bagno_comune

    - name: "Scaldasalviette Bagno Taverna"
      unique_id: scaldasalviette_bagno_taverna

      state: >
        {{ is_state(
          'input_boolean.scaldasalviette_bagno_taverna',
          'on'
        ) }}

      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.scaldasalviette_bagno_taverna

      turn_off:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.scaldasalviette_bagno_taverna
