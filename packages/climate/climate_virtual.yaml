    icon: mdi:water-percent

  temp_locale_tecnico:
    name: "Temperatura Locale Tecnico"
    min: -10
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  humidity_locale_tecnico:
    name: "Umidità Locale Tecnico"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  # Garage
  temp_garage:
    name: "Temperatura Garage"
    min: -10
    max: 50
    step: 0.1
