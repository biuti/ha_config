# TEMPORANEO — simulazione virtuale in attesa dell'hardware fisico
# Rimuovere questo file quando il dispositivo reale è installato

# packages/climate/climate_virtual.yaml
# Sensori temperatura e umidità per stanza
# Simulati con input_number in attesa dei sensori ZigBee fisici

input_boolean:

  # ── NILAN HCR 800T — VMC + riscaldamento/raffrescamento ──
  nilan_on:
    name: "Nilan Acceso"
    icon: mdi:air-filter

  nilan_modalita_estate:
    name: "Nilan Modalità Estate"
    icon: mdi:sun-thermometer

  nilan_defrost:
    name: "Nilan Defrost Attivo"
    icon: mdi:snowflake-melt

  geo_pompa_circolatore:
    name: "Geotermico Pompa Circolatore"
    icon: mdi:pump

  # ── INNOVA FILOMURO SLW 600 ───────────────────────────────
  innova_piano_terra_on:
    name: "Fancoil Piano Terra Acceso"
    icon: mdi:fan

  innova_piano_primo_on:
    name: "Fancoil Piano Primo Acceso"
    icon: mdi:fan

  # ── PANASONIC WH-WXG9ME8 — pompa di calore ───────────────
  panasonic_on:
    name: "Panasonic PDC Accesa"
    icon: mdi:heat-pump

  panasonic_compressore_attivo:
    name: "Panasonic Compressore Attivo"
    icon: mdi:engine

  panasonic_modalita_riscaldamento:
    name: "Panasonic Riscaldamento"
    icon: mdi:radiator

  panasonic_defrost:
    name: "Panasonic Defrost"
    icon: mdi:snowflake-melt

  # ── SCALDASALVIETTE ELETTRICO ────────────────────────────
  scaldasalviette_bagno_padronale:
    name: Scaldasalviette Bagno Padronale
    icon: mdi:radiator

  scaldasalviette_bagno_comune:
    name: Scaldasalviette Bagno Comune
    icon: mdi:radiator

  scaldasalviette_bagno_taverna:
    name: Scaldasalviette Bagno Taverna
    icon: mdi:radiator

input_number:

  # Piano Primo
  temp_soggiorno:
    name: "Temperatura Soggiorno"
    min: -10
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  humidity_soggiorno:
    name: "Umidità Soggiorno"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  co2_soggiorno:
    name: "CO2 Soggiorno"
    min: 300
    max: 3000
    step: 10
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2

  # Piano Terra
  temp_camera_padronale:
    name: "Temperatura Camera Padronale"
    min: -10
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  humidity_camera_padronale:
    name: "Umidità Camera Padronale"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  co2_camera_padronale:
    name: "CO2 Camera Padronale"
    min: 300
    max: 3000
    step: 10
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2

  temp_camera:
    name: "Temperatura Camera"
    min: -10
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  humidity_camera:
    name: "Umidità Camera"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  temp_studio:
    name: "Temperatura Studio"
    min: -10
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  humidity_studio:
    name: "Umidità Studio"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  temp_bagno_padronale:
    name: "Temperatura Bagno Padronale"
    min: -10
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  humidity_bagno_padronale:
    name: "Umidità Bagno Padronale"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  temp_bagno_comune:
    name: "Temperatura Bagno Comune"
    min: -10
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  humidity_bagno_comune:
    name: "Umidità Bagno Comune"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  # Seminterrato
  temp_taverna:
    name: "Temperatura Taverna"
    min: -10
    max: 50
