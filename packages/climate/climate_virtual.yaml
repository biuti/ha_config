  # ── PANASONIC WH-WXG9ME8 ─────────────────────────────────
  panasonic_temp_mandata:
    name: "Panasonic Temperatura Mandata"
    min: 0
    max: 60
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up

  panasonic_temp_target:
    name: "Panasonic Temperatura Target"
    min: 16
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-auto

  panasonic_frequenza_compressore:
    name: "Panasonic Frequenza Compressore"
    min: 0
    max: 120
    step: 1
