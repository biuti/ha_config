# packages/climate/nilan.yaml

template:

  - binary_sensor:

      - name: "Nilan Attiva"
        unique_id: nilan_attiva
        state: >
          {{ is_state('input_boolean.nilan_on', 'on') }}

      - name: "Nilan Defrost"
        unique_id: nilan_defrost
        state: >
          {{ is_state('input_boolean.nilan_defrost', 'on') }}

      # GEOTERMIA
      - name: "Geotermico Pompa Attiva"
        unique_id: geotermico_pompa_attiva
        state: >
          {{ is_state(
              'input_boolean.geo_pompa_circolatore',
              'on'
            ) }}

  - sensor:

      - name: "Nilan State"
        unique_id: nilan_state
        state: >
          {% if is_state('input_boolean.nilan_on', 'off') %}
            disconnected
          {% else %}
            {% set cop = states('input_number.nilan_cop') | float(0) %}

            {% if is_state('input_boolean.nilan_defrost', 'on') %}
              defrost
            {% elif cop > 0 %}
              climatizing
            {% else %}
              venting
            {% endif %}
          {% endif %}

      - name: "Nilan Temperatura Mandata"
        unique_id: nilan_temperatura_mandata
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states(
              'input_number.nilan_temperatura_mandata'
            ) }}

      - name: "Nilan Temperatura Ripresa"
        unique_id: nilan_temperatura_ripresa
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states(
              'input_number.nilan_temperatura_ripresa'
            ) }}

      - name: "Nilan Velocità Ventilatore"
        unique_id: nilan_velocita_ventilatore
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {{ states(
              'input_number.nilan_velocita_ventilatore'
            ) }}

      - name: "Nilan COP"
        unique_id: nilan_cop
        state_class: measurement
        state: >
          {{ states('input_number.nilan_cop') }}

      # GEOTERMIA
      - name: "Geotermico Temperatura Uscita"
        unique_id: geotermico_temperatura_uscita
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states(
              'input_number.geo_temp_aria_post_scambiatore'
            ) }}
