# packages/climate/panasonic.yaml

template:

  - binary_sensor:

      - name: "Panasonic Attiva"
        unique_id: panasonic_attiva
        state: >
          {{ is_state('input_boolean.panasonic_on', 'on') }}

      - name: "Panasonic Compressore Attivo"
        unique_id: panasonic_compressore_attivo
        state: >
          {{ is_state(
              'input_boolean.panasonic_compressore_attivo',
              'on'
            ) }}

      - name: "Panasonic Riscaldamento"
        unique_id: panasonic_riscaldamento
        state: >
          {{ is_state(
              'input_boolean.panasonic_modalita_riscaldamento',
              'on'
            ) }}

      - name: "Panasonic ACS Attiva"
        unique_id: panasonic_acs_attiva

        state: >
          {{ is_state(
              'input_boolean.bollitore_on',
              'on'
            ) }}

      - name: "Panasonic Defrost"
        unique_id: panasonic_defrost
        state: >
          {{ is_state('input_boolean.panasonic_defrost','on') }}

  - sensor:

      - name: "Panasonic State"
        unique_id: panasonic_state
        state: >
          {% if is_state('input_boolean.panasonic_on', 'off') %}
            disconnected
          {% else %}
            {% if is_state('input_boolean.panasonic_defrost', 'on') %}
              defrost
            {% elif is_state('input_boolean.bollitore_on', 'on') %}
              ACS
            {% elif is_state('input_boolean.panasonic_compressore_attivo', 'on') %}
              {% if is_state('input_boolean.panasonic_modalita_riscaldamento', 'on') %}
                heating
              {% else %}
                cooling
              {% endif %}
            {% else %}
              idle
            {% endif %}
          {% endif %}

      - name: "Panasonic Temperatura Mandata"
        unique_id: panasonic_temperatura_mandata
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states('input_number.panasonic_temp_mandata') }}

      - name: "Panasonic Frequenza Compressore"
        unique_id: panasonic_frequenza_compressore
        unit_of_measurement: "Hz"
        state_class: measurement
        state: >
          {{ states(
              'input_number.panasonic_frequenza_compressore'
            ) }}

      - name: "Panasonic COP"
        unique_id: panasonic_cop
        state_class: measurement
        state: >
          {{ states('input_number.panasonic_cop') }}

      - name: "Panasonic Temperatura ACS"
        unique_id: panasonic_temperatura_acs

        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

        state: >
          {{ states(
              'input_number.temp_bollitore'
            ) }}

      - name: "Panasonic Target ACS"
        unique_id: panasonic_target_acs

        unit_of_measurement: "°C"
        device_class: temperature

        state: >
          {{ states(
              'input_number.temp_target_bollitore'
            ) }}
