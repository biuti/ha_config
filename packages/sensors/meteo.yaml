# packages/weather/weather.yaml

input_text:

  meteo_forecast_hourly:
    name: "Meteo forecast Hourly"
    icon: mdi:weather
    max: 8192

  meteo_forecast_daily:
    name: "Meteo forecast Daily"
    icon: mdi:weather
    max: 8192

template:

  - sensor:

    - name: Meteo Attuale
      unique_id: meteo_attuale

      state: >
        {{ states('weather.forecast_home') }}

    - name: Temperatura Esterna
      unique_id: temperatura_esterna

      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

      state: >
        {{ state_attr('weather.forecast_home', 'temperature') }}

    - name: Vento
      unique_id: vento

      state: >
        {% set speed = state_attr('weather.forecast_home', 'wind_speed') | float(0) %}
        {% set bearing = state_attr('weather.forecast_home', 'wind_bearing') | float(0) %}

        {% set dirs = {
          0:'N',
          1:'NE',
          2:'E',
          3:'SE',
          4:'S',
          5:'SO',
          6:'O',
          7:'NO'
        } %}

        {% set idx = ((bearing + 22.5) // 45) % 8 %}

        {{ "%2s %5.1f km/h" | format(dirs[idx | int], speed) }}

    - name: Umidita Esterna
      unique_id: umidita_esterna

      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

      state: >
        {{ state_attr('weather.forecast_home', 'humidity') }}

    - name: Pressione
      unique_id: pressione_atmosferica

      unit_of_measurement: "hPa"
      device_class: pressure
      state_class: measurement

      state: >
        {{ state_attr('weather.forecast_home', 'pressure') }}

    - name: Meteo Accumulo Pioggia 6 Ore
      unique_id: accumulo_pioggia_6_ore
      unit_of_measurement: "mm"

      state: >
        {% set fc =
          states('input_text.meteo_forecast_hourly')
          | default('[]')
          | from_json %}

        {{
          fc[:6]
          | map(attribute='precipitation')
          | sum
          | round(1)
        }}

    - name: Meteo Accumulo Pioggia Domani
      unique_id: accumulo_pioggia_domani
      unit_of_measurement: "mm"

      state: >
        {% set fc =
          states('input_text.meteo_forecast_daily')
          | default('[]')
          | from_json %}

        {% if fc | count > 1 %}
          {{ fc[1].get('precipitation', 0) }}
        {% else %}
          0
        {% endif %}

    - name: Meteo Temperatura Domani
      unique_id: temperatura_max_domani
      unit_of_measurement: "°C"

      state: >
        {% set fc =
          states('input_text.meteo_forecast_daily')
          | default('[]')
          | from_json %}

        {% if fc | count > 1 %}
          {{ fc[1].get('temperature', 0) }}
        {% else %}
          0
        {% endif %}
