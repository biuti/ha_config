# TEMPORANEO — simulazione virtuale in attesa dell'hardware fisico
# Rimuovere questo file quando il dispositivo reale è installato

# packages/energy/energy_virtual.yaml
# Sistema energetico: SigenStor (FV + accumulo + rete), colonnina ricarica auto
# Integrazione reale: HACS Sigenergy ESS via Modbus TCP
# Virtual sensors simulano le entità principali del sistema

input_boolean:

  # ── SIGENSTOR ─────────────────────────────────────────────
  sigenstor_on:
    name: "SigenStor Attivo"
    icon: mdi:battery-charging

  sigenstor_modalita_remota:
    name: "SigenStor Modalità Remota EMS"
    icon: mdi:remote

  # ── COLONNINA RICARICA AUTO ───────────────────────────────
  ev_collegata:
    name: "EV Collegata"
    icon: mdi:power-plug

  # ── SENSORE BLACKOUT ──────────────────────────────────────
  blackout_rete:
    name: "Blackout Rete"
    icon: mdi:transmission-tower-off

input_number:

  # ── PRODUZIONE FV ─────────────────────────────────────────
  fv_potenza_attuale:
    name: "FV Potenza Attuale"
    min: 0
    max: 12000
    step: 10
    unit_of_measurement: "W"
    icon: mdi:solar-power

  fv_energia_oggi:
    name: "FV Energia Prodotta Oggi"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "kWh"
    icon: mdi:solar-power-variant

  # ── ACCUMULO BATTERIA ─────────────────────────────────────
  batteria_soc:
    name: "Batteria Stato di Carica"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery

  batteria_potenza:
    name: "Batteria Potenza"

    # Convenzione:
    # +W = batteria in carica
    # -W = batteria in scarica

    min: -10000
    max: 10000
    step: 10
    unit_of_measurement: "W"
    icon: mdi:battery-charging-outline

  # ── EV ────────────────────────────────────────────────────
  ev_soc:
    name: "EV Stato di Carica"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-charging

  ev_capacita:
    name: "EV Capacita"
    min: 10000
    max: 120000
    step: 1000
    unit_of_measurement: "Wh"
    initial: 40000
    icon: mdi:battery

  # ── RETE ──────────────────────────────────────────────────
  rete_potenza:
    name: "Rete Potenza"
    min: -10000
    max: 10000
    step: 10
    unit_of_measurement: "W"
    icon: mdi:transmission-tower

  rete_energia_importata_oggi:
    name: "Rete Energia Importata Oggi"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "kWh"
    icon: mdi:transmission-tower-import

  rete_energia_esportata_oggi:
    name: "Rete Energia Esportata Oggi"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "kWh"
    icon: mdi:transmission-tower-export

  # ── CONSUMI CASA ──────────────────────────────────────────
  casa_potenza_totale:
    name: "Casa Potenza Totale"
    min: 0
    max: 20000
    step: 10
    unit_of_measurement: "W"
    icon: mdi:home-lightning-bolt

  # ── COLONNINA AUTO ────────────────────────────────────────
  colonnina_potenza:
    name: "Colonnina Potenza Ricarica"
    min: 0
    max: 22000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:ev-station

  colonnina_energia_sessione:
    name: "Colonnina Energia Sessione"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "kWh"
    icon: mdi:battery-charging-100

template:

  - sensor:

      # ── FV ─────────────────────────────────────────────

      - name: "FV Power"
        unique_id: fv_power
        unit_of_measurement: "W"
        state: >
          {{ states('input_number.fv_potenza_attuale') }}

      - name: "FV State"
        unique_id: fv_state
        state: >
          {% set producing =
            is_state('binary_sensor.fv_producing', 'on') %}

          {% if producing %}
            producing
          {% else %}
            idle
          {% endif %}

      # ── BATTERIA ───────────────────────────────────────

      - name: "Battery SOC"
        unique_id: battery_soc
        unit_of_measurement: "%"
        state: >
          {{ states('input_number.batteria_soc') }}

      - name: "Battery Power"
        unique_id: battery_power
        unit_of_measurement: "W"
        state: >
          {{ states('input_number.batteria_potenza') }}

      - name: "Battery State"
        unique_id: battery_state
        state: >
          {% set p = states('input_number.batteria_potenza') | float(0) %}
          {% set grid_import =
            is_state('binary_sensor.grid_import', 'on') %}
          {% set grid_export =
            is_state('binary_sensor.grid_export', 'on') %}

          {% if p < -200 %}

            {% if grid_export %}
              discharging_to_grid
            {% else %}
              discharging
            {% endif %}

          {% elif p > 200 %}

            {% if grid_import %}
              charging_from_grid
            {% else %}
              charging
            {% endif %}

          {% else %}
            idle
          {% endif %}

      # ── RETE ───────────────────────────────────────────

      - name: "Grid Power"
        unique_id: grid_power
        unit_of_measurement: "W"
        state: >
          {{ states('input_number.rete_potenza') }}

      - name: "Grid State"
        unique_id: grid_state
        state: >
          {% if is_state('input_boolean.blackout_rete', 'on') %}
            disconnected
          {% else %}
            {% set p = states('input_number.rete_potenza') | float(0) %}

            {% if p > 50 %}
              importing
            {% elif p < -50 %}
              exporting
            {% else %}
              idle
            {% endif %}
          {% endif %}

      # ── CASA ───────────────────────────────────────────

      - name: "Home Power"
        unique_id: home_power
        unit_of_measurement: "W"
        state: >
          {{ states('input_number.casa_potenza_totale') }}

      - name: "Home State"
        unique_id: home_state
        state: >
          {% set blackout =
            is_state('input_boolean.blackout_rete', 'on') %}

          {% set fv =
            states('input_number.fv_potenza_attuale') | float(0) %}

          {% set bat =
            states('input_number.batteria_potenza') | float(0) %}

          {% set ev =
            states('input_number.colonnina_potenza') | float(0) %}

          {% set home =
            states('input_number.casa_potenza_totale') | float(0) %}

          {% set balance = fv - home - ev - bat %}

          {% set soc =
            states('input_number.batteria_soc') | float(0) %}

          {% if not blackout %}

            {% if is_state('binary_sensor.grid_import', 'on') %}
              importing
            {% else %}
              exporting
            {% endif %}

          {% else %}

            {% if balance < 50 and soc < 20 %}
              critical

            {% elif balance > 100 %}
              notice

            {% else %}
              warning

            {% endif %}

          {% endif %}

      # ── AUTO ───────────────────────────────────────────

      - name: "EV SOC"
        unique_id: ev_soc
        unit_of_measurement: "%"
        state: >
          {{ states('input_number.ev_soc') }}

      - name: "EV Power"
        unique_id: ev_power
        unit_of_measurement: "W"
        state: >
          {{ states('input_number.colonnina_potenza') }}

      - name: "EV State"
        unique_id: ev_state
        state: >
          {% if is_state('input_boolean.ev_collegata', 'off') %}
            disconnected
          {% else %}
            {% set p = states('input_number.colonnina_potenza') | float(0) %}
            {% set grid_import =
              is_state('binary_sensor.grid_import', 'on') %}
            {% set grid_export =
              is_state('binary_sensor.grid_export', 'on') %}

            {% if p > 200 %}

              {% if grid_import %}
                charging_from_grid
              {% else %}
                charging
              {% endif %}

            {% elif p < -200 %}

              {% if grid_export %}
                discharging_to_grid
              {% else %}
                discharging
              {% endif %}

            {% else %}
              idle
            {% endif %}
          {% endif %}

  - binary_sensor:

      - name: "FV producing"
        unique_id: fv_producing
        state: >
          {{ states('input_number.fv_potenza_attuale') | float > 50 }}

      - name: "Battery Charging"
        unique_id: battery_charging
        state: >
          {{ states('input_number.batteria_potenza') | float > 50 }}

      - name: "Battery Discharging"
        unique_id: battery_discharging
        state: >
          {{ states('input_number.batteria_potenza') | float < -50 }}

      - name: "Grid Import"
        unique_id: grid_import
        state: >
          {{ states('input_number.rete_potenza') | float > 50 }}

      - name: "Grid Export"
        unique_id: grid_export
        state: >
          {{ states('input_number.rete_potenza') | float < -50 }}

      - name: "EV Charging"
        unique_id: ev_charging
        state: >
          {{ states('input_number.colonnina_potenza') | float > 100 }}
