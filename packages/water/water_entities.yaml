# packages/water/water_entities.yaml

input_number:

  # ── SUPERFICIE ────────────────────────────────────────────
  superficie_raccolta_acqua:
    min: 50
    max: 500
    step: 10
    initial: 200

  rendimento_raccolta_acqua:
    min: 0.1
    max: 1
    step: 0.05
    initial: 0.8

  # ── CAPACITA ────────────────────────────────────────────────
  capacita_vasca_irrigazione:
    min: 500
    max: 5000
    step: 100
    initial: 2000

  capacita_vasca_sanitari:
    min: 500
    max: 5000
    step: 100
    initial: 2000

  # ── VOLUMI ──────────────────────────────────────────────────
  acqua_raccolta_oggi:
    min: 0
    max: 6000
    step: 1

  acqua_irrigazione_oggi:
    min: 0
    max: 5000
    step: 1

  acqua_sanitari_oggi:
    min: 0
    max: 6000
    step: 1

  acqua_rete_irrigazione_oggi:
    min: 0
    max: 10000
    step: 1

  acqua_rete_sanitari_oggi:
    min: 0
    max: 10000
    step: 1

  acqua_overflow_oggi:
    min: 0
    max: 5000
    step: 1

  # ── VASCA 1 — irrigazione ─────────────────────────────────
  volume_vasca_irrigazione:
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: L

  soglia_minima_vasca_irrigazione:
    name: "Soglia Minima Vasca Irrigazione"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    initial: 10
    icon: mdi:gauge-low

  isteresi_vasca_irrigazione:
    name: Isteresi Vasca Irrigazione
    min: 1
    max: 20
    step: 1
    unit_of_measurement: "%"
    initial: 5

  # ── VASCA 2 — scarichi sanitari ───────────────────────────
  volume_vasca_sanitari:
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: L

  soglia_minima_vasca_sanitari:
    name: "Soglia Minima Vasca Sanitari"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    initial: 10
    icon: mdi:gauge-low

  isteresi_vasca_sanitari:
    name: Isteresi Vasca Sanitari
    min: 1
    max: 20
    step: 1
    unit_of_measurement: "%"
    initial: 5

template:

  - binary_sensor:

      - name: Vasca Irrigazione Bassa
        unique_id: vasca_irrigazione_bassa

        state: >
          {{
            states('sensor.vasca_irrigazione')|float <
            states('input_number.soglia_minima_vasca_irrigazione')|float
          }}

      - name: Vasca Sanitari Bassa
        unique_id: vasca_sanitari_bassa

        state: >
          {{
            states('sensor.vasca_sanitari')|float <
            states('input_number.soglia_minima_vasca_sanitari')|float
          }}
