# packages/water/water_simulation.yaml

automation:

  - id: update_precipitazione_prossima_ora
    alias: Meteo - Aggiorna Precipitazione Prossima Ora

    triggers:
      - trigger: homeassistant
        event: start

      - trigger: time_pattern
        minutes: "/15"

    actions:

      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: hourly

      - variables:

          rain_next_hour: >
            {{
              hourly['weather.forecast_home'].forecast[0]
              .get('precipitation', 0)
              if (
                hourly is defined and
                hourly['weather.forecast_home'].forecast | count > 0
              )
              else 0
            }}

      - action: input_number.set_value
        target:
          entity_id: input_number.precipitazione_prossima_ora
        data:
          value: "{{ rain_next_hour }}"

  - id: water_rain_collection

    alias: "Water - Raccolta acqua piovana"

    triggers:

      - trigger: time_pattern
        minutes: "20"

    condition:
      - condition: numeric_state
        entity_id: input_number.precipitazione_prossima_ora
        above: 0

    variables:

      pioggia: >
        {{ states('input_number.precipitazione_prossima_ora') | float(0) }}

      superficie: >
        {{ states('input_number.superficie_raccolta_acqua') | float(0) }}

      rendimento: >
        {{ states('input_number.rendimento_raccolta_acqua') | float(0) }}

      litri_raccolti: >
        {{
          (pioggia * superficie * rendimento)
          | round(1)
        }}

      volume_irrigazione: >
        {{ states('input_number.volume_vasca_irrigazione') | float(0) }}

      volume_sanitari: >
        {{ states('input_number.volume_vasca_sanitari') | float(0) }}

      capacita_irrigazione: >
        {{ states('input_number.capacita_vasca_irrigazione') | float(0) }}

      capacita_sanitari: >
        {{ states('input_number.capacita_vasca_sanitari') | float(0) }}

      nuovo_volume_irrigazione: >
        {{
          [volume_irrigazione + litri_raccolti, capacita_irrigazione]
          | min
        }}

      overflow_irrigazione: >
        {{
          [
            volume_irrigazione + litri_raccolti - capacita_irrigazione,
            0
          ] | max
        }}

      nuovo_volume_sanitari: >
        {{
          [volume_sanitari + overflow_irrigazione, capacita_sanitari]
          | min
        }}

      overflow_finale: >
        {{
          [
            volume_sanitari + overflow_irrigazione - capacita_sanitari,
            0
          ] | max
        }}

    actions:

      - action: input_number.set_value
        target:
          entity_id: input_number.volume_vasca_irrigazione
        data:
          value: "{{ nuovo_volume_irrigazione }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.volume_vasca_sanitari
        data:
          value: "{{ nuovo_volume_sanitari }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.acqua_raccolta_oggi
        data:
          value: >
            {{
              states('input_number.acqua_raccolta_oggi')|float
              + litri_raccolti
            }}

      - action: input_number.set_value
        target:
          entity_id: input_number.acqua_overflow_oggi
        data:
          value: >
            {{
              states('input_number.acqua_overflow_oggi')|float
              + overflow_finale
            }}

  - id: water_sanitary_consumption

    alias: "Water - Consumo Sanitari"

    triggers:
      - trigger: time_pattern
        minutes: "10"

    variables:

      consumo: >
        {{
          (
            states('input_number.consumo_sanitari_giornaliero')
            | float(0)
          ) / 24
        }}

      volume_attuale: >
        {{ states('input_number.volume_vasca_sanitari') | float(0) }}

      bypass: >
        {{ is_state('input_boolean.bypass_vasca_sanitari', 'on') }}

    actions:

      - choose:

          - conditions:
              - condition: template
                value_template: "{{ not bypass }}"

            sequence:

              - action: input_number.set_value
                target:
                  entity_id: input_number.volume_vasca_sanitari
                data:
                  value: >
                    {{
                      [volume_attuale - consumo, 0]
                      | max
                    }}

              - action: input_number.set_value
                target:
                  entity_id: input_number.acqua_sanitari_oggi
                data:
                  value: >
                    {{
                      states('input_number.acqua_sanitari_oggi')|float
                      + consumo
                    }}

        default:

          - action: input_number.set_value
            target:
              entity_id: input_number.acqua_rete_sanitari_oggi
            data:
              value: >
                {{
                  states('input_number.acqua_rete_sanitari_oggi')|float
                  + consumo
                }}

    mode: single

  - id: water_irrigation_consumption
    alias: "Irrigazione — Simulazione Consumo Ciclo automatico giornaliero"
    triggers:
      - trigger: template
        value_template: >
          {{ now().strftime('%H:%M') == '%02d:00' | format(states('input_number.ora_irrigazione') | int) }}
    conditions:
      # Non irrigare in modalità vacanza o via
      - condition: template
        value_template: >
          {{ states('input_select.modalita_casa') not in ['Vacanza', 'Fuori Casa'] }}
      # Non irrigare se override pioggia attivo
      - condition: state
        entity_id: input_boolean.override_pioggia_irrigazione
        state: "off"
      # Non irrigare se livello vasca troppo basso
      - condition: state
        entity_id: binary_sensor.vasca_irrigazione_bassa
        state: "off"
      # Non irrigare se piove ora
      - condition: template
        value_template: >
          {{ states('sensor.meteo_attuale') not in
             ['rainy', 'pouring', 'lightning-rainy'] }}
      # Non irrigare se previsione pioggia domani > soglia
      - condition: numeric_state
        entity_id: input_number.accumulo_pioggia_6_ore
        below: 1

    variables:
      portata_prato: >
        {{
          (
            states('input_number.portata_zona_prato') | float(0)
            *
            states('input_number.durata_irrigazione_prato') | float(0)
          ) / 60
        }}
      portata_aiuole: >
        {{
          (
            states('input_number.portata_zona_aiuole') | float(0)
            *
            states('input_number.durata_irrigazione_aiuole') | float(0)
          ) / 60
        }}
      portata_contorno: >
        {{
          (
            states('input_number.portata_zona_contorno') | float(0)
            *
            states('input_number.durata_irrigazione_contorno') | float(0)
          ) / 60
        }}
      consumo: >
        {{
          portata_prato|float(0)
          + portata_aiuole|float(0)
          + portata_contorno|float(0)
        }}
      volume_attuale: >
        {{ states('input_number.volume_vasca_irrigazione') | float(0) }}
      bypass: >
        {{ is_state('input_boolean.bypass_vasca_irrigazione', 'on') }}
      volume_soglia_minima: >
        {{ 
          states('input_number.capacita_vasca_irrigazione') | float(0)
          *
          states('input_number.soglia_minima_vasca_irrigazione') | float(0)
          / 100
        }}
      # simula una logica che impedisca di utilizzare la rete per l'irrigazione automatica
      consumo_effettivo: >
        {{
          [
            consumo|float(0),
            [
              volume_attuale|float(0)
              - volume_soglia_minima|float(0),
              0
            ] | max
          ]
          | min
        }}

    actions:

      - choose:

          - conditions:
              - condition: template
                value_template: "{{ not bypass }}"

            sequence:

              - action: input_number.set_value
                target:
                  entity_id: input_number.volume_vasca_irrigazione
                data:
                  value: >
                    {{
                      [volume_attuale - consumo_effettivo, 0]
                      | max
                    }}

              - action: input_number.set_value
                target:
                  entity_id: input_number.acqua_irrigazione_oggi
                data:
                  value: >
                    {{
                      states('input_number.acqua_irrigazione_oggi')|float
                      + consumo_effettivo
                    }}

        default:

          - action: input_number.set_value
            target:
              entity_id: input_number.acqua_rete_irrigazione_oggi
            data:
              value: >
                {{
                  states('input_number.acqua_rete_irrigazione_oggi')|float
                  + consumo
                }}

    mode: single
