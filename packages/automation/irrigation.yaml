# packages/automation/irrigation.yaml
# Automazioni irrigazione
# Dipendenze:
#   - templates/irrigation_virtual.yaml
#   - templates/water_virtual.yaml
#   - templates/environment_virtual.yaml
#   - automation/overrides.yaml (override_pioggia_irrigazione)
#
# HARDWARE DA INSTALLARE:
#   Controller zone: OpenSprinkler o valvole ZigBee 24V AC
#   Pompa: relè ZigBee o integrata nel controller
#   Sensori livello vasche: galleggiante ultrasonico ZigBee

automation:

  # ── 1. CICLO IRRIGAZIONE AUTOMATICO ──────────────────────

  - id: irrigazione_ciclo_automatico
    alias: "Irrigazione — Ciclo automatico giornaliero"
    description: >
      Ogni giorno all'ora configurata avvia le zone in sequenza.
      Controlla meteo, livello vasca e override prima di partire.
      Le zone vengono attivate una alla volta per la durata configurata.
    triggers:
      - trigger: template
        value_template: >
          {{ now().strftime('%H:%M') == '%02d:00' | format(states('input_number.ora_irrigazione') | int) }}
    conditions:
      # Non irrigare in modalità vacanza o via
      - condition: template
        value_template: >
          {{ states('input_select.modalita_casa') not in ['Vacanza', 'Fuori Casa'] }}
      # Non irrigare se override pioggia attivo
      - condition: state
        entity_id: input_boolean.override_pioggia_irrigazione
        state: "off"
      # Non irrigare se livello vasca troppo basso
      - condition: state
        entity_id: binary_sensor.vasca_irrigazione_bassa
        state: "off"
      # Non irrigare se piove ora
      - condition: template
        value_template: >
          {{ states('sensor.meteo_attuale') not in
             ['rainy', 'pouring', 'lightning-rainy'] }}
      # Non irrigare se previsione pioggia domani > soglia
      - condition: template
        value_template: >
          {% set forecast = states('sensor.meteo_forecast') %}
          {% if forecast and forecast | length > 0 %}
            {% set domani = forecast[0] %}
            {% set prob = domani.get('precipitation_probability', 0) %}
            {{ prob < states('input_number.soglia_probabilita_pioggia') | float }}
          {% else %}
            true
          {% endif %}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pompa_irrigazione

      # Zona 1 — Prato
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigazione_zona1_prato
      - delay:
          minutes: "{{ states('input_number.durata_irrigazione_prato') | int }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigazione_zona1_prato

      # Pausa tra zone (evita sovrapressioni)
      - delay:
          seconds: 30

      # Zona 2 — Aiuole
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigazione_zona2_aiuole
      - delay:
          minutes: "{{ states('input_number.durata_irrigazione_aiuole') | int }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigazione_zona2_aiuole

      - delay:
          seconds: 30

      # Zona 3 — Contorno edificio
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigazione_zona3_contorno
      - delay:
          minutes: "{{ states('input_number.durata_irrigazione_contorno') | int }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigazione_zona3_contorno

      # Spegni pompa
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pompa_irrigazione

      # Aggiorna flag sospensione pioggia (reset)
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigazione_sospesa_pioggia
    mode: single

  # ── 2. SOSPENSIONE PER PIOGGIA ────────────────────────────

  - id: irrigazione_sospendi_pioggia
    alias: "Irrigazione — Sospendi per pioggia"
    description: >
      Quando inizia a piovere, interrompe immediatamente
      l'irrigazione se in corso e attiva l'override pioggia.
    triggers:
      - trigger: state
        entity_id: sensor.meteo_attuale
        to:
          - "rainy"
          - "pouring"
          - "lightning-rainy"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigazione_sospesa_pioggia
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.override_pioggia_irrigazione
      # Ferma tutto se in corso
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.pompa_irrigazione
            - input_boolean.irrigazione_zona1_prato
            - input_boolean.irrigazione_zona2_aiuole
            - input_boolean.irrigazione_zona3_contorno
            - input_boolean.irrigazione_zona4_riserva
    mode: single

  # ── 3. RIPRISTINO DOPO PIOGGIA ────────────────────────────

  - id: irrigazione_ripristina_dopo_pioggia
    alias: "Irrigazione — Ripristina dopo pioggia"
    description: >
      Quando smette di piovere, rilascia l'override irrigazione.
      Attende 2 ore prima di rilasciare per permettere al terreno
      di assorbire l'acqua piovana.
    triggers:
      - trigger: state
        entity_id: sensor.meteo_attuale
        from:
          - "rainy"
          - "pouring"
          - "lightning-rainy"
    conditions:
      - condition: template
        value_template: >
          {{ states('sensor.meteo_attuale') not in
             ['rainy', 'pouring', 'lightning-rainy'] }}
    actions:
      - delay:
          hours: 2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.override_pioggia_irrigazione
    mode: single

  # ── 4. BYPASS VASCA IRRIGAZIONE ─────────────────────────

  - id: irrigazione_bypass_vasca
    alias: "Irrigazione — Bypass Vasca"
    description: >
      Se il livello della vasca scende sotto la soglia configurata,
      apre l'elettrovalvola per alimentare da acqua corrente.
      Chiude quando il livello supera nuovamente la soglia minima impostata.
    triggers:
      - trigger: state
        entity_id: binary_sensor.vasca_irrigazione_bassa
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.bypass_vasca_irrigazione
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bypass_vasca_irrigazione
    mode: single

  - id: irrigazione_ripristino_alimentazione_vasca
    alias: "Irrigazione — Ripristina Alimentazione da Vasca"
    description: >
      Chiude l'elettrovalvola quando il livello supera nuovamente la soglia minima impostata.
    triggers:
      - trigger: template
        value_template: >
          {{
            states('sensor.vasca_irrigazione') | float >
            (
              states('input_number.soglia_minima_vasca_irrigazione') | float +
              states('input_number.isteresi_vasca_irrigazione') | float
            )
          }}
    conditions:
      - condition: state
        entity_id: input_boolean.bypass_vasca_irrigazione
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bypass_vasca_irrigazione
    mode: single

  # ── 5. BYPASS VASCA SANITARI ─────────────────────────────────

  - id: sanitari_bypass_vasca
    alias: "Sanitari — Bypass Vasca"
    description: >
      Se il livello della vasca scende sotto la soglia configurata,
      apre l'elettrovalvola per alimentare da acqua corrente.
      Chiude quando il livello supera nuovamente la soglia minima impostata.
    triggers:
      - trigger: state
        entity_id: binary_sensor.vasca_sanitari_bassa
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.bypass_vasca_sanitari
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bypass_vasca_sanitari
    mode: single

  - id: sanitari_ripristino_alimentazione_vasca
    alias: "Sanitari — Ripristina Alimentazione da Vasca"
    description: >
      Chiude l'elettrovalvola quando il livello supera nuovamente la soglia minima impostata.
    triggers:
      - trigger: template
        value_template: >
          {{
            states('sensor.vasca_sanitari') | float >
            (
              states('input_number.soglia_minima_vasca_sanitari') | float +
              states('input_number.isteresi_vasca_sanitari') | float
            )
          }}
    conditions:
      - condition: state
        entity_id: input_boolean.bypass_vasca_sanitari
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bypass_vasca_sanitari
    mode: single
