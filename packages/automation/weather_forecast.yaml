# packages/automation/weather.yaml
automation:

  - id: update_weather_data
    alias: Meteo - Aggiorna Dati Forecast

    triggers:
      - trigger: homeassistant
        event: start

      - trigger: time_pattern
        minutes: "/30"

    actions:

      # Forecast orario
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: hourly

      # Forecast giornaliero
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: daily

      # Variabili di lavoro
      - variables:

          rain_6h: >
            {{
              (
                hourly['weather.forecast_home'].forecast
                if hourly is defined
                else []
              )[:6]
              | map(attribute='precipitation', default=0)
              | sum
              | round(1)
            }}

          rain_tomorrow: >
            {{
              daily['weather.forecast_home'].forecast[1].get('precipitation', 0)
              if (
                daily is defined and
                daily['weather.forecast_home'].forecast | count > 1
              )
              else 0
            }}

          temp_tomorrow: >
            {{
              daily['weather.forecast_home'].forecast[1].get('temperature', 0)
              if (
                daily is defined and
                daily['weather.forecast_home'].forecast | count > 1
              )
              else 0
            }}

      - action: input_number.set_value
        target:
          entity_id: input_number.accumulo_pioggia_6_ore
        data:
          value: "{{ rain_6h }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.accumulo_pioggia_domani
        data:
          value: "{{ rain_tomorrow }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.temperatura_max_domani
        data:
          value: "{{ temp_tomorrow }}"

    mode: single
    max_exceeded: silent
